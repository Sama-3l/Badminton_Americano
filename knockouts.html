<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Americano</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --border2: #363636;
    --accent: #c8f135;
    --accent2: #a3c920;
    --text: #f0f0f0;
    --muted: #666;
    --muted2: #888;
    --danger: #ff5c5c;
    --win: #c8f135;
    --bye: #f5a623;
    --playoff: #a78bfa;
    --playoff2: #7c3aed;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    width: 100%; max-width: 560px;
    padding: 2rem 1.25rem 0;
  }
  .logo {
    font-family: 'Unbounded', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--accent);
  }
  .logo span { color: var(--muted2); font-weight: 400; }
  .tagline {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── Mode selector ── */
  .mode-selector {
    display: flex;
    gap: 0;
    margin-top: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted2);
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 8px;
    cursor: pointer;
    transition: background .15s, color .15s;
    border-right: 1px solid var(--border);
  }
  .mode-btn:last-child { border-right: none; }
  .mode-btn:hover { background: var(--surface2); color: var(--text); }
  .mode-btn.active {
    background: var(--accent);
    color: #0d0d0d;
    font-weight: 700;
  }
  .mode-desc {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.04em;
    min-height: 16px;
  }

  .main {
    width: 100%; max-width: 560px;
    padding: 1.5rem 1.25rem 4rem;
    flex: 1;
  }

  .input-section { margin-bottom: 1.5rem; }
  .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  input[type=text] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.875rem;
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
    transition: border-color .15s;
  }
  input[type=text]:focus { border-color: var(--border2); }
  input[type=text]::placeholder { color: var(--muted); }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: opacity .12s, transform .1s;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .btn:active { transform: scale(.97); opacity: .85; }
  .btn-add {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border2);
  }
  .btn-add:hover { border-color: var(--muted); }
  .btn-primary {
    background: var(--accent);
    color: #0d0d0d;
    font-weight: 700;
    width: 100%;
    padding: 12px;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { opacity: .35; cursor: not-allowed; transform: none; }
  .btn-copy {
    background: var(--surface2);
    color: var(--accent);
    border: 1px solid var(--accent);
    width: 100%;
    padding: 12px;
    margin-top: 1.25rem;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .btn-copy:hover { background: rgba(200,241,53,.08); }

  .chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    min-height: 36px; margin-bottom: 12px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 99px;
    padding: 4px 10px 4px 12px;
    font-size: 0.78rem;
    color: var(--text);
    animation: popIn .15s ease;
  }
  @keyframes popIn { from { transform: scale(.7); opacity:0; } to { transform:scale(1); opacity:1; } }
  .chip-remove {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 1rem; line-height:1;
    padding: 0; transition: color .1s;
  }
  .chip-remove:hover { color: var(--danger); }

  .info-bar {
    display: flex; gap: 12px; align-items: center;
    font-size: 0.72rem; color: var(--muted);
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .info-bar .count { color: var(--accent); font-weight: 500; }
  .info-bar .warn { color: var(--danger); }
  .info-bar .bye-note { color: var(--bye); }

  .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

  .fixtures-scroll { display: flex; flex-direction: column; gap: 1rem; }

  .round-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: slideIn .2s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .round-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .round-label {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted2);
  }
  .round-label.playoff-label-hdr { color: var(--playoff); }
  .round-done {
    font-size: 0.65rem;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .match {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .match:last-child { border-bottom: none; }
  .match.is-bye-match {
    border-left: 2px solid var(--bye);
    background: rgba(245, 166, 35, 0.04);
  }
  .match.is-playoff {
    border-left: 2px solid var(--playoff);
    background: rgba(167,139,250,0.04);
  }

  .match-teams { display: flex; align-items: center; gap: 8px; }
  .team { flex: 1; font-size: 0.8rem; line-height: 1.5; }
  .team.right { text-align: right; }
  .team-player { display: block; color: var(--text); transition: color .15s; }
  .team-player.winner { color: var(--accent); font-weight: 500; }
  .team-player.bye-volunteer { color: var(--bye); }
  .team-player.bye-volunteer.winner { color: var(--accent); }
  .team-player.tbd { color: var(--muted); font-style: italic; }

  .vs-sep { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.06em; flex-shrink: 0; }

  .score-row {
    display: flex; align-items: center; gap: 8px;
    justify-content: center;
  }
  .score-block {
    display: flex; align-items: center; gap: 0;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    overflow: hidden;
  }
  .score-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted2); font-size: 1.1rem;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    transition: background .1s, color .1s;
    font-family: monospace;
    flex-shrink: 0;
  }
  .score-btn:hover { background: var(--border); color: var(--text); }
  .score-btn:active { background: var(--border2); }
  .score-val {
    width: 38px; text-align: center;
    font-size: 1rem; font-weight: 500;
    color: var(--text);
    font-family: 'Unbounded', sans-serif;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  .score-sep { font-size: 0.7rem; color: var(--muted); padding: 0 4px; }
  .score-lock {
    font-size: 0.72rem; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .score-lock .score-display {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    letter-spacing: 0.04em;
  }
  .score-lock .score-display .s-win { color: var(--accent); }

  .btn-lock {
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    flex-shrink: 0;
    transition: background .1s;
  }
  .btn-lock:hover { background: var(--accent2); }
  .btn-unlock {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    padding: 4px 8px;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .btn-unlock:hover { border-color: var(--muted); color: var(--text); }

  /* ── Points / Standings ── */
  .points-section { margin-top: 1.25rem; }
  .points-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted2);
    margin-bottom: 10px;
  }
  .points-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .points-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .points-row:last-child { border-bottom: none; }
  .points-row.top { background: rgba(200,241,53,.05); }

  /* Knockout standings extras */
  .points-row.qualified {
    background: rgba(167,139,250,0.07);
    border-left: 2px solid var(--playoff);
  }
  .points-row.qualified.top { background: rgba(167,139,250,0.14); }

  .rank-num { font-size: 0.7rem; color: var(--muted); width: 20px; flex-shrink: 0; }
  .rank-num.gold { color: var(--accent); font-weight: 500; }
  .points-name { font-size: 0.85rem; color: var(--text); flex: 1; padding-left: 8px; }
  .points-val {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 700;
  }
  .wl-val {
    font-size: 0.72rem;
    color: var(--muted2);
    margin-right: 10px;
  }
  .seed-pill {
    font-size: 0.62rem;
    padding: 2px 7px;
    border-radius: 99px;
    background: rgba(167,139,250,0.18);
    color: var(--playoff);
    font-weight: 500;
    letter-spacing: 0.04em;
    margin-right: 8px;
    border: 1px solid rgba(167,139,250,0.3);
  }

  /* ── Bracket ── */
  .bracket-section { margin-top: 1.5rem; }
  .bracket-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted2);
    margin-bottom: 10px;
  }
  .bracket-grid {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .bracket-col { display: flex; flex-direction: column; gap: 10px; min-width: 160px; }
  .bracket-col-title {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 2px;
  }
  .b-match {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    overflow: hidden;
  }
  .b-match.playoff-final { border-color: var(--playoff); }
  .b-team {
    padding: 8px 10px;
    font-size: 0.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    color: var(--muted2);
  }
  .b-team:last-child { border-bottom: none; }
  .b-team.tbd { font-style: italic; }
  .b-team.winner { color: var(--accent); font-weight: 500; }
  .b-team.loser { color: var(--muted); }
  .b-score { font-family: 'Unbounded', sans-serif; font-size: 0.75rem; }
  .bracket-arrow {
    font-size: 1.1rem;
    color: var(--muted);
    align-self: center;
    flex-shrink: 0;
    padding-top: 18px;
  }

  .copied-toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #0d0d0d;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem; font-weight: 700;
    padding: 8px 20px; border-radius: 99px;
    letter-spacing: 0.06em; text-transform: uppercase;
    opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 999;
  }
  .copied-toast.show { opacity: 1; }

  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 1.5rem 0 1rem;
  }
  .section-divider-line { flex: 1; border-top: 1px solid var(--border); }
  .section-divider-label {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--playoff);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">AMERICANO<span>/badminton</span></div>
  <div class="tagline">Doubles · Rotating pairs · Individual scoring</div>
  <div class="mode-selector" id="modeSelector">
    <button class="mode-btn active" onclick="setMode('americano')">Americano</button>
    <button class="mode-btn" onclick="setMode('knockout')">Partnership Knockout</button>
  </div>
  <div class="mode-desc" id="modeDesc">Rotating pairs each round · points from scores accumulate per player</div>
</div>

<div class="main">

  <div class="input-section">
    <div class="input-row">
      <input type="text" id="nameInput" placeholder="Enter player name…" maxlength="24" />
      <button class="btn btn-add" onclick="addPlayer()">+ Add</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="info-bar" id="infoBar"></div>
    <button class="btn btn-primary" id="generateBtn" onclick="generate()" disabled>
      Generate fixtures
    </button>
  </div>

  <hr class="divider" id="divider" style="display:none">

  <div class="fixtures-scroll" id="fixturesArea"></div>

  <div class="points-section" id="pointsSection" style="display:none">
    <div class="points-title" id="pointsTitle">Points table</div>
    <div class="points-table" id="pointsTable"></div>
    <button class="btn btn-copy" id="copyBtn" onclick="copyTable()">Copy points table</button>
  </div>

  <div class="bracket-section" id="bracketSection" style="display:none">
    <div class="bracket-title">Knockout bracket</div>
    <div class="bracket-grid" id="bracketGrid"></div>
  </div>

</div>

<div class="copied-toast" id="toast">Copied!</div>

<script>
// ════════════════════════════════════════════════════════════════
// SHARED STATE
// ════════════════════════════════════════════════════════════════
let players = [];
let tournament = null;
let currentMode = 'americano'; // 'americano' | 'knockout'

const nameInput = document.getElementById('nameInput');
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

// ════════════════════════════════════════════════════════════════
// MODE SELECTOR
// ════════════════════════════════════════════════════════════════
const MODE_DESC = {
  americano: 'Rotating pairs each round · points from scores accumulate per player',
  knockout:  'All partnerships play pool matches · top 4 advance to bracket'
};

function setMode(mode) {
  if (tournament) return; // locked once generated
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && mode === 'americano') || (i === 1 && mode === 'knockout'));
  });
  document.getElementById('modeDesc').textContent = MODE_DESC[mode];
  updateBtn();
}

// ════════════════════════════════════════════════════════════════
// SHARED PLAYER MANAGEMENT
// ════════════════════════════════════════════════════════════════
function copyTable() {
  const standings = currentMode === 'knockout' ? computeKnockoutPoints() : computePoints();
  const text = standings.map((s, i) =>
    currentMode === 'knockout'
      ? `${i+1}. ${s.name} – W:${s.w} L:${s.l} Pts:${s.pts}`
      : `${i+1}. ${s.name} - ${s.pts} pts`
  ).join('\n');
  navigator.clipboard.writeText(text).then(() => showToast()).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast();
  });
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function addPlayer() {
  const name = nameInput.value.trim();
  if (!name) return;
  if (players.find(p => p.toLowerCase() === name.toLowerCase())) {
    flash('Already added!'); return;
  }
  players.push(name);
  nameInput.value = '';
  nameInput.focus();
  renderChips();
  updateBtn();
}

function removePlayer(name) {
  if (tournament) return;
  players = players.filter(p => p !== name);
  renderChips();
  updateBtn();
}

function renderChips() {
  const el = document.getElementById('chips');
  el.innerHTML = players.map(p =>
    `<span class="chip">${p}<button class="chip-remove" onclick="removePlayer('${p.replace(/'/g,"\\'")}')">×</button></span>`
  ).join('');
}

function updateBtn() {
  const btn = document.getElementById('generateBtn');
  const bar = document.getElementById('infoBar');
  const n = players.length;

  if (currentMode === 'americano') {
    const isOdd = n % 2 !== 0;
    const valid = n >= 4;
    btn.disabled = !valid || !!tournament;
    if (n === 0) { bar.innerHTML = ''; return; }
    const effectiveN = isOdd ? n + 1 : n;
    const rounds = effectiveN - 1;
    let msg = `<span class="count">${n} players</span> · ${rounds} rounds`;
    if (n < 4) msg += ` · <span class="warn">need at least 4</span>`;
    else if (isOdd) msg += ` · <span class="bye-note">BYE auto-added</span>`;
    bar.innerHTML = msg;
  } else {
    // Knockout: need at least 4, even number preferred (BYE added if odd)
    const valid = n >= 4;
    btn.disabled = !valid || !!tournament;
    if (n === 0) { bar.innerHTML = ''; return; }
    const effectiveN = n % 2 !== 0 ? n + 1 : n;
    const totalPairs = (effectiveN * (effectiveN - 1)) / 2; // C(n,2) partnerships
    const poolMatches = computePoolMatchCount(effectiveN);
    let msg = `<span class="count">${n} players</span> · ${poolMatches} pool matches · ${totalPairs} partnerships`;
    if (n < 4) msg += ` · <span class="warn">need at least 4</span>`;
    else if (n % 2 !== 0) msg += ` · <span class="bye-note">BYE auto-added</span>`;
    else msg += ` · <span style="color:var(--accent)">ready!</span>`;
    bar.innerHTML = msg;
  }
}

// How many pool matches are needed so every pair of players partners at least once?
// Each match covers 2 partnerships (pair1 + pair2). Total partnerships = C(n,2).
// But since we're doing round-robin of partnerships, matches = C(n,2)/2 rounded up.
function computePoolMatchCount(n) {
  const totalPairs = (n * (n - 1)) / 2;
  return Math.ceil(totalPairs / 2);
}

// ════════════════════════════════════════════════════════════════
// AMERICANO — original logic (unchanged except score-based points)
// ════════════════════════════════════════════════════════════════
function generateRoundPairs(playerList) {
  const n = playerList.length;
  const rounds = [];
  const arr = [...playerList];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      pairs.push([arr[i], arr[n - 1 - i]]);
    }
    rounds.push(pairs);
    arr.splice(1, 0, arr.pop());
  }
  return rounds;
}

function generateMatches(pairs) {
  const matches = [];
  for (let i = 0; i < pairs.length; i++) {
    for (let j = i + 1; j < pairs.length; j++) {
      matches.push({ pair1: pairs[i], pair2: pairs[j], score1: 0, score2: 0, locked: false });
    }
  }
  return matches;
}

function assignByeVolunteers(rounds, realPlayers) {
  const byeMatches = [];
  rounds.forEach((rd) => {
    rd.matches.forEach((m) => {
      if (!m.pair1.includes('BYE') && !m.pair2.includes('BYE')) return;
      const inMatch = [...m.pair1, ...m.pair2].filter(p => p !== 'BYE');
      const eligible = realPlayers.filter(p => !inMatch.includes(p));
      byeMatches.push({ m, eligible });
    });
  });
  const total = byeMatches.length;
  if (total === 0) return;
  const n = realPlayers.length;
  const byeCount = {};
  realPlayers.forEach(p => { byeCount[p] = 0; });
  const assignment = new Array(total).fill(null);
  const target = Math.ceil(total / n);

  function solve(idx) {
    if (idx === total) return true;
    const { eligible } = byeMatches[idx];
    const sorted = [...eligible].sort((a, b) => byeCount[a] - byeCount[b]);
    for (const p of sorted) {
      if (byeCount[p] < target) {
        byeCount[p]++;
        assignment[idx] = p;
        if (solve(idx + 1)) return true;
        byeCount[p]--;
        assignment[idx] = null;
      }
    }
    return false;
  }

  if (!solve(0)) {
    // fallback: greedy
    realPlayers.forEach(p => { byeCount[p] = 0; });
    byeMatches.forEach(({ eligible }, idx) => {
      const sorted = [...eligible].sort((a, b) => byeCount[a] - byeCount[b]);
      assignment[idx] = sorted[0];
      byeCount[sorted[0]]++;
    });
  }
  byeMatches.forEach(({ m }, idx) => { m.byeVolunteer = assignment[idx]; });
}

// ════════════════════════════════════════════════════════════════
// PARTNERSHIP KNOCKOUT — generalized for any even number of players
// ════════════════════════════════════════════════════════════════

/**
 * Generate all partnership pool matches for n players (n must be even).
 * Every pair of players partners exactly once across all matches.
 *
 * Uses a 1-factorization of the complete graph K_n:
 *   - K_n has n*(n-1)/2 edges (= all unique partnerships)
 *   - Each "round" is a perfect matching (1-factor): n/2 pairs covering all n players
 *   - There are n-1 such rounds
 *   - Standard round-robin rotation: fix player 0, rotate players 1..n-1
 *
 * Then, within each round we have n/2 partnerships (edges). We pair those
 * partnerships into matches (2 partnerships per match = 4 distinct players),
 * ensuring no player appears on both sides of the same match.
 * Each round produces floor(n/4) matches; if n/2 is odd, one partnership
 * sits out that round and is rescheduled.
 *
 * This guarantees zero repeated partnerships.
 */
function generatePartnershipMatches(playerNames) {
  const n = playerNames.length; // must be even

  // Build n-1 rounds via standard round-robin rotation
  // Round r: fix index 0, rotate indices 1..n-1 by r positions
  const rounds = [];
  const indices = Array.from({length: n}, (_, i) => i);

  for (let r = 0; r < n - 1; r++) {
    // Build the rotated array for this round
    const arr = [0]; // fix player at position 0
    for (let i = 1; i < n; i++) {
      arr.push(1 + ((i - 1 + r) % (n - 1)));
    }
    // Pair them: arr[0]&arr[n-1], arr[1]&arr[n-2], ...
    const roundPairs = [];
    for (let i = 0; i < n / 2; i++) {
      roundPairs.push([arr[i], arr[n - 1 - i]]);
    }
    rounds.push(roundPairs);
  }

  // Now pair the partnerships within each round into matches.
  // Each match = 2 partnerships, all 4 players distinct.
  // Since each round has n/2 partnerships, if n/2 is even we get clean pairings.
  // If n/2 is odd, one partnership per round is left over — collect and pair them
  // with each other at the end.
  const matches = [];
  const leftovers = []; // unpaired partnerships from odd rounds

  for (const roundPairs of rounds) {
    const usedInRound = new Array(roundPairs.length).fill(false);
    for (let i = 0; i < roundPairs.length; i++) {
      if (usedInRound[i]) continue;
      const [a, b] = roundPairs[i];
      let paired = false;
      for (let j = i + 1; j < roundPairs.length; j++) {
        if (usedInRound[j]) continue;
        const [c, d] = roundPairs[j];
        // All 4 players must be distinct
        if (c !== a && c !== b && d !== a && d !== b) {
          matches.push({
            pair1: [playerNames[a], playerNames[b]],
            pair2: [playerNames[c], playerNames[d]],
            score1: 0, score2: 0, locked: false, isPool: true
          });
          usedInRound[i] = true;
          usedInRound[j] = true;
          paired = true;
          break;
        }
      }
      if (!paired) {
        leftovers.push([a, b]);
      }
    }
  }

  // Leftovers form a cycle (each player appears in exactly 2 leftover partnerships).
  // A simple linear greedy fails on cycles — use skip-rotation to maximally pair them.
  // Find the skip distance that pairs the most leftovers, then apply it.
  const lUsed = new Array(leftovers.length).fill(false);

  if (leftovers.length > 1) {
    let bestSkip = 2, bestCount = -1;
    for (let skip = 2; skip < leftovers.length; skip++) {
      let count = 0;
      const tmp = new Array(leftovers.length).fill(false);
      for (let i = 0; i < leftovers.length; i++) {
        if (tmp[i]) continue;
        const j = (i + skip) % leftovers.length;
        if (tmp[j] || i === j) continue;
        const [a, b] = leftovers[i], [c, d] = leftovers[j];
        if (c !== a && c !== b && d !== a && d !== b) { tmp[i] = true; tmp[j] = true; count++; }
      }
      if (count > bestCount) { bestCount = count; bestSkip = skip; }
    }
    for (let i = 0; i < leftovers.length; i++) {
      if (lUsed[i]) continue;
      const j = (i + bestSkip) % leftovers.length;
      if (lUsed[j] || i === j) continue;
      const [a, b] = leftovers[i], [c, d] = leftovers[j];
      if (c !== a && c !== b && d !== a && d !== b) {
        matches.push({
          pair1: [playerNames[a], playerNames[b]],
          pair2: [playerNames[c], playerNames[d]],
          score1: 0, score2: 0, locked: false, isPool: true
        });
        lUsed[i] = true;
        lUsed[j] = true;
      }
    }
  }

  // Any truly unpaired leftover (at most 1, only for n ≡ 2 mod 4) gets a BYE match
  for (let i = 0; i < leftovers.length; i++) {
    if (!lUsed[i]) {
      const [a, b] = leftovers[i];
      matches.push({
        pair1: [playerNames[a], playerNames[b]],
        pair2: ['BYE', 'BYE'],
        score1: 0, score2: 0, locked: false, isPool: true, isByePool: true
      });
    }
  }

  return matches;
}

function makePlayoffMatch(label) {
  return { pair1: [null, null], pair2: [null, null], score1: 0, score2: 0, locked: false, label, isPlayoff: true };
}

function generateKnockout(playerNames) {
  const isOdd = playerNames.length % 2 !== 0;
  const pool = isOdd ? [...playerNames, 'BYE'] : [...playerNames];
  const poolMatches = generatePartnershipMatches(pool);

  // ── BYE volunteer assignment for odd-player tournaments ─────────
  // Matches that contain the synthetic 'BYE' player need a real volunteer
  // shown as "Name (BYE)". Each real player gets at most one BYE slot.
  if (isOdd) {
    const byeSlots = [];
    poolMatches.forEach((m, mi) => {
      m.pair1.forEach((p, si) => { if (p === 'BYE') byeSlots.push({ mi, side: 1, si }); });
      m.pair2.forEach((p, si) => { if (p === 'BYE') byeSlots.push({ mi, side: 2, si }); });
    });

    const n = playerNames.length;
    const byeCount = {};
    playerNames.forEach(p => { byeCount[p] = 0; });
    const maxBye = Math.ceil(byeSlots.length / n);
    const assignment = new Array(byeSlots.length).fill(null);

    function solve(idx) {
      if (idx === byeSlots.length) return true;
      const { mi } = byeSlots[idx];
      const m = poolMatches[mi];
      const inMatch = new Set([...m.pair1, ...m.pair2].filter(p => p !== 'BYE'));
      const eligible = playerNames
        .filter(p => !inMatch.has(p) && byeCount[p] < maxBye)
        .sort((a, b) => byeCount[a] - byeCount[b]);
      for (const p of eligible) {
        byeCount[p]++;
        assignment[idx] = p;
        if (solve(idx + 1)) return true;
        byeCount[p]--;
        assignment[idx] = null;
      }
      return false;
    }

    if (!solve(0)) {
      playerNames.forEach(p => { byeCount[p] = 0; });
      byeSlots.forEach(({ mi }, idx) => {
        const m = poolMatches[mi];
        const inMatch = new Set([...m.pair1, ...m.pair2].filter(p => p !== 'BYE'));
        const eligible = playerNames
          .filter(p => !inMatch.has(p))
          .sort((a, b) => byeCount[a] - byeCount[b]);
        assignment[idx] = eligible[0];
        byeCount[eligible[0]]++;
      });
    }

    byeSlots.forEach(({ mi, side, si }, idx) => {
      const m = poolMatches[mi];
      if (side === 1) { if (!m.pair1Bye) m.pair1Bye = []; m.pair1Bye[si] = assignment[idx]; }
      else            { if (!m.pair2Bye) m.pair2Bye = []; m.pair2Bye[si] = assignment[idx]; }
    });
  }

  const playoff = {
    semi1: makePlayoffMatch('Semi-final 1'),
    semi2: makePlayoffMatch('Semi-final 2'),
    final: makePlayoffMatch('Final'),
    third: makePlayoffMatch('3rd place')
  };
  return { players: [...playerNames], effectivePlayers: pool, poolMatches, playoff, generated: true };
}

function resolvePlayoffSeeds(ko) {
  const standings = computeKnockoutPoints(ko);
  const get = i => standings[i] ? standings[i].name : null;
  // 1 & 4 vs 2 & 3
  ko.playoff.semi1.pair1 = [get(0), get(3)];
  ko.playoff.semi1.pair2 = [get(1), get(2)];
  // 5 & 8 vs 6 & 7 (if enough players)
  ko.playoff.semi2.pair1 = [get(4), get(7)];
  ko.playoff.semi2.pair2 = [get(5), get(6)];

  if (ko.playoff.semi1.locked && ko.playoff.semi2.locked) {
    const [w1, l1] = getWinnerLoser(ko.playoff.semi1);
    const [w2, l2] = getWinnerLoser(ko.playoff.semi2);
    ko.playoff.final.pair1 = w1;
    ko.playoff.final.pair2 = w2;
    ko.playoff.third.pair1 = l1;
    ko.playoff.third.pair2 = l2;
  } else if (ko.playoff.semi1.locked) {
    const [w1, l1] = getWinnerLoser(ko.playoff.semi1);
    ko.playoff.final.pair1 = w1;
    ko.playoff.third.pair1 = l1;
    ko.playoff.final.pair2 = [null, null];
    ko.playoff.third.pair2 = [null, null];
  }
}

function getWinnerLoser(m) {
  if (!m.locked) return [[null,null],[null,null]];
  if (m.score1 >= m.score2) return [m.pair1, m.pair2];
  return [m.pair2, m.pair1];
}

/**
 * Knockout pool scoring:
 * Each player earns the score their pair scored in the match.
 * BYE players are excluded from the standings.
 * Win/loss is tracked for seeding tiebreaker.
 */
function computeKnockoutPoints(ko) {
  const src = ko || tournament;
  const pts = {}, wins = {}, losses = {}, draws = {};
  src.players.forEach(p => { pts[p] = 0; wins[p] = 0; losses[p] = 0; draws[p] = 0; });

  src.poolMatches.forEach(m => {
    if (!m.locked) return;
    const s1 = m.score1, s2 = m.score2;

    // Resolve pair members: replace 'BYE' with the assigned volunteer (pair1Bye/pair2Bye)
    const resolveReal = (pair, byeArr) =>
      pair.map((p, si) => (p === 'BYE' && byeArr && byeArr[si]) ? byeArr[si] : p)
          .filter(p => p !== 'BYE' && pts[p] !== undefined);

    const realP1 = resolveReal(m.pair1, m.pair1Bye);
    const realP2 = resolveReal(m.pair2, m.pair2Bye);

    // Each player earns the score their pair achieved
    realP1.forEach(p => { pts[p] += s1; });
    realP2.forEach(p => { pts[p] += s2; });

    if (s1 > s2) {
      realP1.forEach(p => wins[p]++);
      realP2.forEach(p => losses[p]++);
    } else if (s2 > s1) {
      realP2.forEach(p => wins[p]++);
      realP1.forEach(p => losses[p]++);
    } else {
      realP1.forEach(p => draws[p]++);
      realP2.forEach(p => draws[p]++);
    }
  });

  return Object.entries(pts)
    .map(([name, p]) => ({ name, pts: p, w: wins[name], l: losses[name], d: draws[name] }))
    .sort((a, b) => b.pts - a.pts || b.w - a.w);
}

// ════════════════════════════════════════════════════════════════
// GENERATE (dispatcher)
// ════════════════════════════════════════════════════════════════
function generate() {
  if (currentMode === 'americano') {
    generateAmericano();
  } else {
    generateKnockoutTournament();
  }
}

function generateAmericano() {
  const n = players.length;
  if (n < 4) return;
  const isOdd = n % 2 !== 0;
  const pool = isOdd ? [...players, 'BYE'] : [...players];
  const roundPairs = generateRoundPairs(pool);
  const rounds = roundPairs.map((pairs, i) => ({
    roundNum: i + 1, pairs, matches: generateMatches(pairs)
  }));
  if (isOdd) assignByeVolunteers(rounds, players);
  tournament = { mode: 'americano', players: [...players], isOdd, rounds };
  lockUI();
  renderFixtures();
}

function generateKnockoutTournament() {
  if (players.length < 4) return;
  tournament = generateKnockout(players);
  tournament.mode = 'knockout';
  lockUI();
  renderFixtures();
}

function lockUI() {
  document.getElementById('generateBtn').disabled = true;
  document.querySelectorAll('.chip-remove').forEach(b => b.style.display = 'none');
  document.getElementById('divider').style.display = '';
  nameInput.disabled = true;
  document.querySelector('.btn-add').disabled = true;
  document.querySelectorAll('.mode-btn').forEach(b => { b.disabled = true; b.style.opacity = b.classList.contains('active') ? '1' : '0.35'; });
}

// ════════════════════════════════════════════════════════════════
// RENDER FIXTURES — dispatcher
// ════════════════════════════════════════════════════════════════
function renderFixtures() {
  if (!tournament) { document.getElementById('fixturesArea').innerHTML = ''; return; }
  if (tournament.mode === 'americano') renderAmericanoFixtures();
  else renderKnockoutFixtures();
}

// ════════════════════════════════════════════════════════════════
// AMERICANO RENDER
// ════════════════════════════════════════════════════════════════
function renderAmericanoFixtures() {
  const area = document.getElementById('fixturesArea');
  area.innerHTML = tournament.rounds.map((rd, ri) => {
    const allLocked = rd.matches.length > 0 && rd.matches.every(m => m.locked);
    const pairLine = rd.pairs
      .map(p => p.map(name => name === 'BYE' ? '<span style="color:var(--bye)">BYE</span>' : name).join(' & '))
      .join(' | ');
    return `
    <div class="round-block" id="round-${ri}">
      <div class="round-header" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <div style="display:flex;width:100%;justify-content:space-between;">
          <span class="round-label">Round ${rd.roundNum}</span>
          ${allLocked ? '<span class="round-done">✓ done</span>' : ''}
        </div>
        <div style="font-size:0.7rem;color:var(--muted);">${pairLine}</div>
      </div>
      ${rd.matches.map((m, mi) => renderAmericanoMatch(ri, mi, m)).join('')}
    </div>`;
  }).join('');
  updateAmericanoPointsTable();
}

function renderAmericanoMatch(ri, mi, m) {
  const resolveNames = (pair) => pair.map(name => {
    if (name === 'BYE' && m.byeVolunteer) return { display: `${m.byeVolunteer} (BYE)`, real: m.byeVolunteer, isBye: true };
    return { display: name, real: name, isBye: false };
  });
  const p1 = resolveNames(m.pair1);
  const p2 = resolveNames(m.pair2);
  const w1 = m.locked && m.score1 > m.score2;
  const w2 = m.locked && m.score2 > m.score1;
  const isByeMatch = !!m.byeVolunteer;
  const playerTag = (p, winner) =>
    `<span class="team-player ${winner ? 'winner' : ''} ${p.isBye ? 'bye-volunteer' : ''}">${p.display}</span>`;
  const teamLeft = `<div class="team">${p1.map(p => playerTag(p, w1)).join('')}</div>`;
  const teamRight = `<div class="team right">${p2.map(p => playerTag(p, w2)).join('')}</div>`;
  let scoreHtml;
  if (m.locked) {
    scoreHtml = `<div class="score-row"><div class="score-lock">
      <span class="score-display">
        <span class="${w1?'s-win':''}">${m.score1}</span>
        <span style="color:var(--muted);font-size:.7rem"> – </span>
        <span class="${w2?'s-win':''}">${m.score2}</span>
      </span>
      <button class="btn-unlock" onclick="americanoUnlock(${ri},${mi})">edit</button>
    </div></div>`;
  } else {
    scoreHtml = `<div class="score-row">
      <div class="score-block">
        <button class="score-btn" onclick="americanoAdj(${ri},${mi},1,-1)">−</button>
        <div class="score-val">${m.score1}</div>
        <button class="score-btn" onclick="americanoAdj(${ri},${mi},1,1)">+</button>
      </div>
      <span class="score-sep">vs</span>
      <div class="score-block">
        <button class="score-btn" onclick="americanoAdj(${ri},${mi},2,-1)">−</button>
        <div class="score-val">${m.score2}</div>
        <button class="score-btn" onclick="americanoAdj(${ri},${mi},2,1)">+</button>
      </div>
      <button class="btn-lock" onclick="americanoLock(${ri},${mi})">Save</button>
    </div>`;
  }
  return `<div class="match${isByeMatch?' is-bye-match':''}">
    <div class="match-teams">${teamLeft}<span class="vs-sep">vs</span>${teamRight}</div>
    ${scoreHtml}
  </div>`;
}

function americanoAdj(ri, mi, side, delta) {
  const m = tournament.rounds[ri].matches[mi];
  if (side === 1) m.score1 = Math.max(0, m.score1 + delta);
  else m.score2 = Math.max(0, m.score2 + delta);
  renderFixtures();
}
function americanoLock(ri, mi) { tournament.rounds[ri].matches[mi].locked = true; renderFixtures(); }
function americanoUnlock(ri, mi) { tournament.rounds[ri].matches[mi].locked = false; renderFixtures(); }

function updateAmericanoPointsTable() {
  const section = document.getElementById('pointsSection');
  const table = document.getElementById('pointsTable');
  document.getElementById('bracketSection').style.display = 'none';
  document.getElementById('pointsTitle').textContent = 'Points table';
  const standings = computePoints();
  const hasAny = standings.some(s => s.pts > 0);
  if (!hasAny) { section.style.display = 'none'; return; }
  section.style.display = '';
  table.innerHTML = standings.map((s, i) => `
    <div class="points-row ${i===0?'top':''}">
      <span class="rank-num ${i===0?'gold':''}">${i+1}</span>
      <span class="points-name">${s.name}</span>
      <span class="points-val">${s.pts}</span>
    </div>`).join('');
}

// ════════════════════════════════════════════════════════════════
// KNOCKOUT RENDER
// ════════════════════════════════════════════════════════════════
function renderKnockoutFixtures() {
  const area = document.getElementById('fixturesArea');
  resolvePlayoffSeeds(tournament);

  const totalPairs = (tournament.effectivePlayers.length * (tournament.effectivePlayers.length - 1)) / 2;
  const covered = countPairsCovered();

  const poolHTML = tournament.poolMatches.map((m, mi) => {
    return `<div class="round-block" id="km-${mi}">${renderKnockoutMatch(m, 'pool', mi)}</div>`;
  }).join('');

  const playoffEntries = [
    ['semi1', tournament.playoff.semi1],
    ['semi2', tournament.playoff.semi2],
    ['final', tournament.playoff.final],
    ['third', tournament.playoff.third],
  ];
  const playoffHTML = playoffEntries.map(([key, m]) => {
    return `<div class="round-block" id="kp-${key}">${renderKnockoutMatch(m, 'playoff', key)}</div>`;
  }).join('');

  const divHTML = `<div class="section-divider">
    <div class="section-divider-line"></div>
    <div class="section-divider-label">⬡ Playoff stage</div>
    <div class="section-divider-line"></div>
  </div>`;

  area.innerHTML = `
    <div style="font-size:0.7rem;color:var(--muted);margin-bottom:8px">
      Pool stage · ${tournament.poolMatches.length} matches · 
      <span style="color:var(--accent)">${covered}/${totalPairs}</span> partnerships covered
    </div>
    ${poolHTML}
    ${divHTML}
    ${playoffHTML}
  `;

  updateKnockoutStandings();
}

function countPairsCovered() {
  const done = new Set();
  const key = (x, y) => [x, y].sort().join(',');
  tournament.poolMatches.forEach(m => {
    if (!m.locked) return;
    const r1 = m.pair1.map((p, si) => (p === 'BYE' && m.pair1Bye && m.pair1Bye[si]) ? m.pair1Bye[si] : p);
    const r2 = m.pair2.map((p, si) => (p === 'BYE' && m.pair2Bye && m.pair2Bye[si]) ? m.pair2Bye[si] : p);
    if (!r1.includes('BYE')) done.add(key(r1[0], r1[1]));
    if (!r2.includes('BYE')) done.add(key(r2[0], r2[1]));
  });
  return done.size;
}

function renderKnockoutMatch(m, stage, id) {
  const isPlayoff = stage === 'playoff';
  const isByePool = m.isByePool; // the lone unpaired partnership match
  const w1 = m.locked && m.score1 > m.score2;
  const w2 = m.locked && m.score2 > m.score1;
  const hasTBD = m.pair1.some(p => !p) || m.pair2.some(p => !p);

  // For the lone isByePool match: resolve opponents from 5th & 6th in live standings
  // (only considering matches BEFORE this one, i.e. the first 22 locked matches)
  let byeOpponents = [null, null]; // [5th, 6th]
  if (isByePool && !m.locked) {
    const poolIdx = Number(id);
    const prevMatches = tournament.poolMatches.slice(0, poolIdx);
    const tempKo = { ...tournament, poolMatches: prevMatches };
    const standings = computeKnockoutPoints(tempKo);
    byeOpponents = [
      standings[4] ? standings[4].name : null,
      standings[5] ? standings[5].name : null,
    ];
  }

  // Resolve display names: replace 'BYE' with volunteer if assigned
  const resolveDisplay = (pair, byeArr, winner, isBye) => pair.map((name, si) => {
    if (name === 'BYE' && byeArr && byeArr[si]) {
      return `<span class="team-player ${winner ? 'winner' : ''}" style="color:var(--bye)">${byeArr[si]} <span style="font-size:0.65rem;opacity:0.8">(BYE)</span></span>`;
    }
    if (!name) return `<span class="team-player tbd">TBD</span>`;
    return `<span class="team-player ${winner ? 'winner' : ''}">${name}</span>`;
  }).join('');

  const teamLeft  = `<div class="team">${resolveDisplay(m.pair1, m.pair1Bye, w1, false)}</div>`;

  // For isByePool match the opponents are dynamic (5th & 6th); render accordingly
  let teamRight;
  if (isByePool && !m.locked) {
    const opp = byeOpponents.map(name =>
      name
        ? `<span class="team-player" style="color:var(--bye)">${name} <span style="font-size:0.65rem;opacity:0.8">(BYE)</span></span>`
        : `<span class="team-player tbd">TBD — finish prior matches</span>`
    ).join('');
    teamRight = `<div class="team right">${opp}</div>`;
  } else {
    teamRight = `<div class="team right">${resolveDisplay(m.pair2, m.pair2Bye, w2, false)}</div>`;
  }

  let scoreHtml;
  if (m.locked) {
    scoreHtml = `<div class="score-row"><div class="score-lock">
      <span class="score-display">
        <span class="${w1?'s-win':''}">${m.score1}</span>
        <span style="color:var(--muted);font-size:.7rem"> – </span>
        <span class="${w2?'s-win':''}">${m.score2}</span>
      </span>
      <button class="btn-unlock" onclick="koUnlock('${stage}','${id}')">edit</button>
    </div></div>`;
  } else if (hasTBD && isPlayoff) {
    scoreHtml = `<div class="score-row"><span style="font-size:0.7rem;color:var(--muted)">Awaiting semi-final results</span></div>`;
  } else if (isByePool) {
    // Only allow scoring if both opponents are resolved
    const ready = byeOpponents[0] && byeOpponents[1];
    if (!ready) {
      scoreHtml = `<div class="score-row"><span style="font-size:0.7rem;color:var(--bye)">Complete the first ${Number(id)} matches to reveal opponents</span></div>`;
    } else {
      scoreHtml = `<div class="score-row">
        <div class="score-block">
          <button class="score-btn" onclick="koAdj('${stage}','${id}',1,-1)">−</button>
          <div class="score-val">${m.score1}</div>
          <button class="score-btn" onclick="koAdj('${stage}','${id}',1,1)">+</button>
        </div>
        <span class="score-sep">vs</span>
        <div class="score-block">
          <button class="score-btn" onclick="koAdj('${stage}','${id}',2,-1)">−</button>
          <div class="score-val">${m.score2}</div>
          <button class="score-btn" onclick="koAdj('${stage}','${id}',2,1)">+</button>
        </div>
        <button class="btn-lock" onclick="koLockBye('pool','${id}')">Save</button>
      </div>`;
    }
  } else {
    scoreHtml = `<div class="score-row">
      <div class="score-block">
        <button class="score-btn" onclick="koAdj('${stage}','${id}',1,-1)">−</button>
        <div class="score-val">${m.score1}</div>
        <button class="score-btn" onclick="koAdj('${stage}','${id}',1,1)">+</button>
      </div>
      <span class="score-sep">vs</span>
      <div class="score-block">
        <button class="score-btn" onclick="koAdj('${stage}','${id}',2,-1)">−</button>
        <div class="score-val">${m.score2}</div>
        <button class="score-btn" onclick="koAdj('${stage}','${id}',2,1)">+</button>
      </div>
      <button class="btn-lock" onclick="koLock('${stage}','${id}')">Save</button>
    </div>`;
  }

  const matchNum = stage === 'pool' ? `Match ${Number(id)+1}` : m.label;
  const headerLabel = isPlayoff
    ? `<span class="round-label playoff-label-hdr">${matchNum}</span>`
    : `<span class="round-label">Match ${Number(id)+1}${isByePool ? ' <span style=\"color:var(--bye);font-size:0.55rem;margin-left:4px\">5th vs 6th (BYE)</span>' : ''}</span>`;
  const allDone = m.locked ? '<span class="round-done">✓ done</span>' : '';

  return `
    <div class="round-header">
      ${headerLabel}
      ${allDone}
    </div>
    <div class="match${isPlayoff?' is-playoff':''}${isByePool?' is-bye-match':''}">
      <div class="match-teams">${teamLeft}<span class="vs-sep">vs</span>${teamRight}</div>
      ${scoreHtml}
    </div>`;
}

function getKnockoutMatch(stage, id) {
  if (stage === 'pool') return tournament.poolMatches[Number(id)];
  return tournament.playoff[id];
}

function koAdj(stage, id, side, delta) {
  const m = getKnockoutMatch(stage, id);
  if (!m) return;
  if (side === 1) m.score1 = Math.max(0, m.score1 + delta);
  else m.score2 = Math.max(0, m.score2 + delta);
  renderFixtures();
}

function koLock(stage, id) {
  const m = getKnockoutMatch(stage, id);
  if (!m) return;
  m.locked = true;
  renderFixtures();
}

// Special lock for the isByePool match: snapshot the live 5th & 6th into pair2
function koLockBye(stage, id) {
  const m = getKnockoutMatch(stage, id);
  if (!m) return;
  const poolIdx = Number(id);
  const prevMatches = tournament.poolMatches.slice(0, poolIdx);
  const tempKo = { ...tournament, poolMatches: prevMatches };
  const standings = computeKnockoutPoints(tempKo);
  const p5 = standings[4] ? standings[4].name : null;
  const p6 = standings[5] ? standings[5].name : null;
  if (!p5 || !p6) { alert('Complete the first ' + poolIdx + ' matches first!'); return; }
  m.pair2 = [p5, p6];
  m.isByePool = true;
  m.locked = true;
  renderFixtures();
}

function koUnlock(stage, id) {
  const m = getKnockoutMatch(stage, id);
  if (!m) return;
  m.locked = false;
  if (stage === 'playoff' && (id === 'semi1' || id === 'semi2')) {
    tournament.playoff.final.locked = false;
    tournament.playoff.third.locked = false;
    tournament.playoff.final.score1 = 0; tournament.playoff.final.score2 = 0;
    tournament.playoff.third.score1 = 0; tournament.playoff.third.score2 = 0;
  }
  renderFixtures();
}

function updateKnockoutStandings() {
  const section = document.getElementById('pointsSection');
  const table = document.getElementById('pointsTable');
  const bracketSec = document.getElementById('bracketSection');
  document.getElementById('pointsTitle').textContent = 'Pool standings';

  const standings = computeKnockoutPoints();
  const hasAny = standings.some(s => s.pts > 0);

  if (!hasAny) {
    section.style.display = 'none';
    bracketSec.style.display = 'none';
    return;
  }

  section.style.display = '';

  table.innerHTML = standings.map((s, i) => {
    const qualified = i < 4;
    return `<div class="points-row ${i===0?'top':''} ${qualified?'qualified':''}">
      <span class="rank-num ${i===0?'gold':''}">${i+1}</span>
      <span class="points-name">${s.name}</span>
      <span class="wl-val">${s.w}W ${s.l}L</span>
      ${qualified ? `<span class="seed-pill">Seed ${i+1}</span>` : ''}
      <span class="points-val">${s.pts}</span>
    </div>`;
  }).join('');

  renderBracket(standings);
}

function renderBracket(standings) {
  const bracketSec = document.getElementById('bracketSection');
  const grid = document.getElementById('bracketGrid');

  const pl = tournament.playoff;

  function teamLabel(pair) {
    if (!pair || !pair[0]) return 'TBD';
    return pair.filter(Boolean).join(' & ') || 'TBD';
  }
  function bTeam(pair, isWinner, isLoser, score, showScore) {
    const cls = isWinner ? 'winner' : isLoser ? 'loser' : (!pair || !pair[0]) ? 'tbd' : '';
    return `<div class="b-team ${cls}">
      <span>${teamLabel(pair)}</span>
      ${showScore ? `<span class="b-score">${score}</span>` : ''}
    </div>`;
  }
  function bMatch(m, isFinal) {
    const w1 = m.locked && m.score1 > m.score2;
    const w2 = m.locked && m.score2 > m.score1;
    return `<div class="b-match ${isFinal?'playoff-final':''}">
      ${bTeam(m.pair1, w1, m.locked&&!w1, m.score1, m.locked)}
      ${bTeam(m.pair2, w2, m.locked&&!w2, m.score2, m.locked)}
    </div>`;
  }

  bracketSec.style.display = '';
  grid.innerHTML = `
    <div class="bracket-col">
      <div class="bracket-col-title">Semis</div>
      <div style="font-size:0.65rem;color:var(--muted);text-align:center;margin-bottom:4px">Semi 1 · Seeds 1&4 vs 2&3</div>
      ${bMatch(pl.semi1, false)}
      <div style="font-size:0.65rem;color:var(--muted);text-align:center;margin-top:8px;margin-bottom:4px">Semi 2 · Seeds 5&8 vs 6&7</div>
      ${bMatch(pl.semi2, false)}
    </div>
    <div class="bracket-arrow">→</div>
    <div class="bracket-col">
      <div class="bracket-col-title">Finals</div>
      <div style="font-size:0.65rem;color:var(--playoff);text-align:center;margin-bottom:4px">Final</div>
      ${bMatch(pl.final, true)}
      <div style="font-size:0.65rem;color:var(--muted);text-align:center;margin-top:8px;margin-bottom:4px">3rd place</div>
      ${bMatch(pl.third, false)}
    </div>
  `;
}

// ════════════════════════════════════════════════════════════════
// AMERICANO POINTS — score-based (each player gets their pair's score)
// ════════════════════════════════════════════════════════════════
function computePoints() {
  const pts = {};
  tournament.players.forEach(p => { pts[p] = 0; });
  tournament.rounds.forEach(rd => {
    rd.matches.forEach(m => {
      if (!m.locked) return;
      // Resolve BYE slots to the volunteer
      const real1 = m.pair1.map(n => (n === 'BYE' && m.byeVolunteer) ? m.byeVolunteer : n);
      const real2 = m.pair2.map(n => (n === 'BYE' && m.byeVolunteer) ? m.byeVolunteer : n);
      // Each player earns the score their pair achieved
      real1.forEach(p => { if (pts[p] !== undefined) pts[p] += m.score1; });
      real2.forEach(p => { if (pts[p] !== undefined) pts[p] += m.score2; });
    });
  });
  return Object.entries(pts)
    .map(([name, p]) => ({ name, pts: p }))
    .sort((a, b) => b.pts - a.pts);
}

function flash(msg) {
  const bar = document.getElementById('infoBar');
  const prev = bar.innerHTML;
  bar.innerHTML = `<span class="warn">${msg}</span>`;
  setTimeout(() => { bar.innerHTML = prev; }, 1500);
}
</script>
